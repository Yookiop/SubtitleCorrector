<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <title>Subtitle Corrector - instellingen</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 26px 20px 60px;
      font: 14px/1.5 "Segoe UI", system-ui, sans-serif;
      background: #14161c; color: #e8eef7;
    }
    .wrap { max-width: 720px; margin: 0 auto; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    .sub { color: #93a1b5; margin-bottom: 22px; }
    section {
      background: #1b1f28; border: 1px solid #2b3140; border-radius: 10px;
      padding: 14px 16px; margin-bottom: 14px;
    }
    h2 { font-size: 14px; margin: 0 0 12px; color: #7ef0ff; letter-spacing: .3px; text-transform: uppercase; }
    .field { display: flex; align-items: center; gap: 14px; padding: 7px 0; border-bottom: 1px solid #232936; }
    .field:last-child { border-bottom: 0; }
    .field label { flex: 1; }
    .field .hint { display: block; color: #77839a; font-size: 12px; }
    .field input[type="text"], .field input[type="number"], .field select {
      width: 220px; padding: 7px 9px; font: inherit; color: #e8eef7;
      background: #10131a; border: 1px solid #333c4d; border-radius: 7px;
    }
    .field input[type="checkbox"] { width: 18px; height: 18px; accent-color: #35c8e6; }
    .actions { display: flex; gap: 10px; margin-top: 6px; }
    button {
      padding: 9px 16px; cursor: pointer; font: 600 13px "Segoe UI", system-ui, sans-serif;
      color: #06121a; background: linear-gradient(180deg, #7ef0ff, #35c8e6);
      border: 0; border-radius: 8px;
    }
    button.secondary { background: #232936; color: #cfd9e6; border: 1px solid #333c4d; }
    #status { margin-left: 10px; color: #56e39f; font-size: 13px; }
    #status.err { color: #ff7a7a; }
    code { font-family: Consolas, monospace; background: #232936; padding: 1px 5px; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Subtitle Corrector</h1>
    <div class="sub">Zet YouTube-ondertitels automatisch in de taal van de audio (EN/NL) en schakelt auto-vertaling uit.</div>

    <section>
      <h2>Algemeen</h2>
      <div class="field">
        <label>Extensie actief
          <span class="hint">Zet alles uit zonder de extensie te verwijderen.</span>
        </label>
        <input type="checkbox" id="enabled">
      </div>
      <div class="field">
        <label>Hotkey actief
          <span class="hint">Standaard uit. Aan: de hotkey werkt als aan/uit-schakelaar voor dít tabblad &mdash; de eerste keer drukken zet de ondertiteling volledig uit (captions uit, Caption Boost uit, geen audio-analyse, ook als YouTube ze daarna opnieuw aanzet), nog een keer drukken zet alles weer aan en past de correctie toe. Uit: de hotkey doet helemaal niets &mdash; geen correctie en geen melding; de toets gaat gewoon naar de pagina.</span>
        </label>
        <input type="checkbox" id="hotkeyEnabled">
      </div>
      <div class="field">
        <label>Hotkey
          <span class="hint">Eén teken, eventueel met modifiers, bv. <code>]</code> of <code>ctrl+]</code>. Leeg (<code>&lt;empty&gt;</code>) = hotkey uit.</span>
        </label>
        <input type="text" id="hotkey" maxlength="12" placeholder="<empty>">
      </div>
      <div class="field">
        <label>Automatisch bij elke nieuwe video
          <span class="hint">Detecteert de audiotaal zodra je een video opent (aanrader).</span>
        </label>
        <input type="checkbox" id="autoApply">
      </div>
      <div class="field">
        <label>Ondertitels aanzetten als ze uit staan
          <span class="hint">YouTube vergeet ze soms te activeren; dan zetten we de juiste track gewoon aan.</span>
        </label>
        <input type="checkbox" id="forceSubtitlesOn">
      </div>
      <div class="field">
        <label>Als ik ze zelf uitzet, niet opnieuw aanzetten
          <span class="hint">Per video onthouden dat jij ondertitels bewust uit hebt gezet.</span>
        </label>
        <input type="checkbox" id="respectUserOff">
      </div>
      <div class="field">
        <label>Vertaling herstellen als YouTube hem opnieuw aanzet
          <span class="hint">YouTube zet de auto-vertaling soms midden in een video terug.</span>
        </label>
        <input type="checkbox" id="fixTranslation">
      </div>
      <div class="field">
        <label>Toast in de speler tonen
          <span class="hint">Korte melding linksonder in de video met wat er is gedaan.</span>
        </label>
        <input type="checkbox" id="showToast">
      </div>
      <div class="field">
        <label>Debug-logging in de console
          <span class="hint">Extra logging met <code>[SC]</code> in de console (F12).</span>
        </label>
        <input type="checkbox" id="debug">
      </div>
    </section>

    <section>
      <h2>Ondertitelkeuze</h2>
      <div class="field">
        <label>Auto-gegenereerd boven handmatig
          <span class="hint">Prioriteit 1 = auto-gegenereerde ondertitel, prioriteit 2 = handmatige ondertitel.</span>
        </label>
        <input type="checkbox" id="preferAutoGenerated">
      </div>
    </section>

    <section>
      <h2>Prestaties (caption-prioriteit)</h2>
      <div class="field">
        <label>Eigen ondertitelweergave (Caption Boost)
          <span class="hint">Toont de ondertitel in blokken van 2 volle zinnen, in één keer: het hele blok staat direct in beeld en blijft staan tot het volgende blok begint. Zo blijven zinnen bij elkaar en komt er geen halfgevuld blok meer waarin de rest van de zin pas later verschijnt. Zet <b>Word-for-Word</b> aan voor woord-voor-woord, zoals YouTube's auto-gegenereerde ondertitels. Een sprekerswissel (<b>&gt;&gt;</b>) begint altijd op een nieuwe regel. Elk woord krijgt zijn <b>eigen zwarte achtergrond die samen met dat woord verschijnt</b> (de blokjes van een regel groeien aan elkaar vast), in plaats van één zwarte balk achter het hele venster — net als bij YouTube's auto-ondertitels. Verbergt YouTube's eigen caption-venster zolang dat lukt; lost het "loopt 1-2 seconden achter en plopt dan in blokken"-probleem op — ook als dat zonder deze extensie gebeurt.</span>
        </label>
        <input type="checkbox" id="captionBoost">
      </div>
      <div class="field">
        <label>Ondertitelgrootte (%)
          <span class="hint">50 - 250%. <b>100% = precies zo groot als YouTube's eigen ondertitels</b>; 130% is de standaard van de extensie. Handige stappen: 75, 100, 125, 150, 175, 200. De rest van de stijl (tekstkleur, achtergrondkleur en -opacity én de grove "Font size"-stand) wordt automatisch uit je YouTube-ondertitelinstellingen overgenomen.</span>
        </label>
        <input type="number" id="captionSize" min="50" max="250" step="5" list="captionSizePresets">
        <datalist id="captionSizePresets">
          <option value="75"></option>
          <option value="100"></option>
          <option value="125"></option>
          <option value="150"></option>
          <option value="175"></option>
          <option value="200"></option>
        </datalist>
      </div>
      <div class="field">
        <label>Lettertype
          <span class="hint">Het font van de eigen ondertitelweergave. "Proportionele sans-serif" is YouTube's eigen caption-font — <b>Roboto</b>, precies het font van de ondertitels die je zonder deze extensie ziet (niet YouTube Sans: dat is het rondere merkfont van de site). Daaronder staan veelgebruikte leesfonts als Arial, Verdana, Segoe UI, Cambria, Georgia, Times New Roman en Palatino. Kies je voor een serif-leesfont, zet dan <b>Letterdikte</b> op <b>Normaal</b> — dat leest prettiger en is wat YouTube bij zo'n font doet.</span>
        </label>
        <select id="captionFont">
          <option value="youtube">Proportionele sans-serif (YouTube's eigen)</option>
        </select>
      </div>
      <div class="field">
        <label>Letterdikte
          <span class="hint">De dikte van de letters: <b>300 t/m 700, in stappen van 25</b>. <b>400 = normaal (de standaard</b>, en de dikte waarin YouTube zijn eigen ondertitels tekent); 300 = licht, 700 = vet. De fijnere stappen (350, 375, …) werken op variable fonts zoals Roboto op YouTube; bij een gewoon font pakt de browser de dichtstbijzijnde beschikbare dikte.</span>
        </label>
        <select id="captionWeight">
          <option value="400">400 (normaal, standaard)</option>
        </select>
      </div>
      <div class="field">
        <label>Ondertitelbreedte (%)
          <span class="hint">Breedte van het ondertitelvlak als percentage van de spelerbreedte: 30 - 100%. Het vlak staat gecentreerd, dus je houdt links en rechts altijd video zichtbaar. Standaard 50%; lager = smaller. De zwarte achtergrond zelf is per woord en dus zo breed als de tekst; deze instelling bepaalt hoe breed de tekst mag worden voordat hij naar de volgende regel wikkelt. Let op: in een smaller vlak past een blok van 2 volle zinnen minder vaak in het venster van 2 regels (wat niet past wordt onderaan afgekapt); met <b>Word-for-Word</b> speelt dat niet, want daar rolt het venster mee.</span>
        </label>
        <input type="number" id="captionWidth" min="30" max="100" step="1">
      </div>
      <div class="field">
        <label>Ondertitelregels
          <span class="hint">Hoogte van het vaste captionblok in regels; "2 regels" is de standaard. Het blok is altijd precies zo hoog — ook als er maar één zin in staat: de 1e regel staat linksboven, de 2e blijft dan leeg. Past een blok van 2 zinnen niet helemaal, dan wordt de tekst onderaan afgekapt. Het font krimpt nooit en er schuift niets op.</span>
        </label>
        <select id="captionLines">
          <option value="2">2 regels (standaard)</option>
          <option value="1">1 regel</option>
        </select>
      </div>
      <div class="field">
        <label>Y-offset (%)
          <span class="hint">Verticale positie van de ondertiteling, in procentpunten van de spelerhoogte. <b>Positief = omlaag</b> (dichter bij de onderrand), <b>negatief = omhoog</b>. De standaard is 9 (dus iets hoger dan het uitgangspunt); 0 = geen verschuiving. Bereik −40 tot +30. De ondertiteling blijft altijd binnen de speler.</span>
        </label>
        <input type="number" id="captionOffset" min="-40" max="30" step="1">
      </div>
      <div class="field">
        <label>X-offset (%)
          <span class="hint">Horizontale positie van de ondertiteling, in procentpunten van de spelerbreedte. <b>Positief = naar rechts</b>, <b>negatief = naar links</b>. De standaard is −9 (dus iets links van het midden); 0 = gecentreerd. Bereik −40 tot +40. Met een positieve waarde schuift de ondertiteling dus naar rechts en blijft er links meer video zichtbaar (en andersom).</span>
        </label>
        <input type="number" id="captionOffsetX" min="-40" max="40" step="1">
      </div>
      <div class="field">
        <label>Word-for-Word
          <span class="hint">Toont de ondertiteling woord voor woord, zoals YouTube's auto-gegenereerde ondertitels: elk woord verschijnt op zijn eigen tijd — <b>met zijn eigen zwarte achtergrond</b> — en zodra de onderste regel vol is schuift het venster één regel omhoog (regel 1 verdwijnt, regel 2 wordt regel 1 en de nieuwe woorden gaan verder op regel 2). Heeft een cue geen per-woordtijden (één tijd voor de hele zin), dan worden de woorden over de cue verdeeld — er plopt dus nooit ineens een hele zin in beeld. Een stilte begint weer met een leeg venster. <b>Aan is de standaard</b>; uit = de hele blokken van 2 volle zinnen in één keer.</span>
        </label>
        <input type="checkbox" id="captionWordByWord">
      </div>
      <div class="field">
        <label>Caption-prioriteit
          <span class="hint">De extensie doet tijdens het afspelen zo weinig mogelijk: langere wachttijd bij videostart in playlists, minder pollen op de achtergrond en geen zware audio-analyse zonder hotkey. Zo houdt YouTube meer CPU/GPU over voor het tekenen van de ondertitels.</span>
        </label>
        <input type="checkbox" id="captionPriority">
      </div>
      <div class="field">
        <label>Audio-analyse ook automatisch in playlists
          <span class="hint">Standaard uit. In playlists draait de audio-analyse dan alleen via de hotkey. Aanzetten kost meer CPU/GPU (Whisper) en kan het afspelen laten haperen.</span>
        </label>
        <input type="checkbox" id="audioFallbackInPlaylists">
      </div>
    </section>

    <section>
      <h2>Lokale bridge (audio-analyse)</h2>
      <div class="field">
        <label>Bridge gebruiken als metadata onduidelijk is
          <span class="hint">Fallback: een paar seconden tab-audio opnemen en lokaal de taal herkennen.</span>
        </label>
        <input type="checkbox" id="audioFallback">
      </div>
      <div class="field">
        <label>Bridge-URL
          <span class="hint">Standaard <code>http://127.0.0.1:8791</code> (bridge/bridge_server.py).</span>
        </label>
        <input type="text" id="bridgeUrl" placeholder="http://127.0.0.1:8791">
      </div>
      <div class="field">
        <label>Opnameduur (seconden)
          <span class="hint">2 - 10 seconden. 5 is ruim genoeg voor EN/NL.</span>
        </label>
        <input type="number" id="audioSeconds" min="2" max="10" step="1">
      </div>
      <div class="field">
        <label>Minimale zekerheid
          <span class="hint">0 - 1. Onder deze waarde doet de extensie niets met het resultaat.</span>
        </label>
        <input type="number" id="minConfidence" min="0" max="1" step="0.05">
      </div>
      <div class="field">
        <label>Geluid hoorbaar houden tijdens opname
          <span class="hint">Chrome kan het tabblad dempen tijdens het opnemen; dit speelt het terug. Zet uit bij echo.</span>
        </label>
        <input type="checkbox" id="keepAudioDuringCapture">
      </div>
    </section>

    <div class="actions">
      <button id="save">Opslaan</button>
      <button class="secondary" id="test">Bridge testen</button>
      <button class="secondary" id="reset">Standaardwaarden</button>
      <span id="status"></span>
    </div>
  </div>

  <script src="shared/lang-utils.js"></script>
  <script src="options.js"></script>
</body>
</html>
